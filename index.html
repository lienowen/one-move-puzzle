<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#17100c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>One Move Puzzle</title>
  <link rel="stylesheet" href="./app.css" />
  <link rel="stylesheet" href="./visual-pass.css" />
  <link rel="stylesheet" href="./market-pass.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <section id="homeScreen" class="screen home-screen active" aria-label="Home">
      <header class="topbar">
        <button id="settingsBtn" class="icon-btn" type="button" aria-label="Settings">⚙</button>
        <div class="star-bank"><span>★</span><strong id="homeStars">0</strong></div>
      </header>

      <main class="home-main">
        <div class="brand-kicker">WOOD WORKSHOP</div>
        <div class="brand-lockup" aria-label="One Move Puzzle">
          <span>ONE</span>
          <strong>MOVE</strong>
          <em>PUZZLE</em>
        </div>
        <p class="brand-copy">One decision. Then watch the machine come alive.</p>

        <div class="hero-board" aria-hidden="true">
          <div class="hero-board-inner">
            <div class="hero-route"></div>
            <div class="hero-ball"></div>
            <div class="hero-pin"></div>
            <div class="hero-star">★</div>
            <div class="hero-goal"></div>
          </div>
        </div>
      </main>

      <footer class="home-actions">
        <button id="playBtn" class="primary-btn" type="button">
          <span>PLAY</span>
          <small id="continueLabel">LEVEL 01</small>
          <b>→</b>
        </button>
        <button id="levelsBtn" class="ghost-btn" type="button">SELECT MACHINE <span>▦</span></button>
        <div class="season-label">SEASON 01 · WOOD WORKSHOP</div>
      </footer>
    </section>

    <section id="levelsScreen" class="screen levels-screen" aria-label="Level select">
      <header class="page-header">
        <button id="levelsBackBtn" class="icon-btn" type="button" aria-label="Back">←</button>
        <div class="page-title"><span>WOOD WORKSHOP</span><h1>Select a machine</h1></div>
        <div class="star-bank"><span>★</span><strong id="levelStars">0</strong></div>
      </header>
      <div id="levelGrid" class="level-grid"></div>
    </section>

    <section id="gameScreen" class="screen game-screen" aria-label="Game">
      <header class="game-header">
        <button id="gameBackBtn" class="icon-btn" type="button" aria-label="Back">←</button>
        <div class="game-title">
          <span id="levelNumber">LEVEL 01</span>
          <h1 id="levelTitle">Pull the Pin</h1>
        </div>
        <button id="restartBtn" class="icon-btn" type="button" aria-label="Restart">↻</button>
      </header>

      <div class="objective-bar">
        <p id="levelHint">Pull the blue pin.</p>
        <div id="moveToken" class="move-token"><strong>1</strong><span>MOVE</span></div>
      </div>

      <main id="stage" class="stage" aria-label="Puzzle machine">
        <div id="world" class="world"></div>
        <div id="tapFx" class="tap-fx"></div>
      </main>

      <footer class="game-footer">
        <span id="statusText">Choose one piece.</span>
        <div id="miniProgress" class="mini-progress" aria-hidden="true"></div>
      </footer>
    </section>

    <section id="resultSheet" class="modal" hidden>
      <div class="result-card">
        <div id="resultBadge" class="result-badge">★</div>
        <span class="modal-kicker">MACHINE SOLVED</span>
        <h2 id="resultTitle">Perfect move</h2>
        <div id="resultStars" class="result-stars">★★★</div>
        <p id="resultCopy">One move. Clean chain.</p>
        <button id="nextBtn" class="primary-btn compact" type="button"><span>NEXT</span><small>KEEP GOING</small><b>→</b></button>
        <button id="retryBtn" class="ghost-btn full" type="button">REPLAY</button>
      </div>
    </section>

    <section id="settingsSheet" class="modal" hidden>
      <div class="settings-card">
        <div class="settings-head">
          <div><span class="modal-kicker">WORKSHOP</span><h2>Settings</h2></div>
          <button id="closeSettingsBtn" class="icon-btn" type="button" aria-label="Close">×</button>
        </div>
        <button id="soundToggle" class="setting-row" type="button"><span>Sound</span><b>ON</b></button>
        <button id="hapticsToggle" class="setting-row" type="button"><span>Haptics</span><b>ON</b></button>
      </div>
    </section>

    <div id="toast" class="toast" role="status"></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
