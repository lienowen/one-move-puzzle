name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '.visual-check/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Install dependencies
        run: npm install

      - name: Build production bundle
        run: npm run build

      - name: Build compact visual review map
        run: |
          python3 -m pip install --quiet pillow
          python3 <<'PY'
          from PIL import Image
          import json
          p = '.visual-check/level1-mobile.jpg'
          img = Image.open(p).convert('RGB').resize((48,104))
          q = img.quantize(colors=16, method=Image.Quantize.MEDIANCUT)
          pal_raw = q.getpalette()[:48]
          palette = ['#%02x%02x%02x' % tuple(pal_raw[i:i+3]) for i in range(0,48,3)]
          px = list(q.getdata())
          alphabet = '0123456789abcdef'
          rows = [''.join(alphabet[v] for v in px[y*48:(y+1)*48]) for y in range(104)]
          with open('.visual-check/review-map.json','w') as f:
              json.dump({'width':48,'height':104,'palette':palette,'rows':rows},f,separators=(',',':'))
          PY
          printf '%s\n' "$GITHUB_RUN_ID" > .visual-check/run-id.txt

      - name: Publish visual review map
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .visual-check/review-map.json .visual-check/run-id.txt
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh visual review map [skip ci]'
            git push
          fi
