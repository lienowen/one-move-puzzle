name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '.visual-check/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Install dependencies
        run: npm install

      - name: Build production bundle
        run: npm run build

      - name: Install browser for visual check
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Capture visual snapshots
        run: |
          mkdir -p .visual-check
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/one-move-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then break; fi
            sleep 1
          done
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const cases = [
              {name:'mobile', width:390, height:844},
              {name:'desktop', width:620, height:900},
            ];
            for (const item of cases) {
              const context = await browser.newContext({viewport:{width:item.width,height:item.height},deviceScaleFactor:1,reducedMotion:'reduce'});
              const page = await context.newPage();
              await page.goto('http://127.0.0.1:4173', {waitUntil:'networkidle'});
              await page.screenshot({path:`.visual-check/home-${item.name}.jpg`,type:'jpeg',quality:58,fullPage:false});
              await page.click('#playBtn');
              await page.waitForTimeout(500);
              await page.screenshot({path:`.visual-check/level1-${item.name}.jpg`,type:'jpeg',quality:62,fullPage:false});
              if (item.name === 'mobile') {
                await page.locator('.machine-board').screenshot({path:'.visual-check/board-mobile.jpg',type:'jpeg',quality:72});
                await page.click('[data-id="pin"]');
                await page.waitForTimeout(1500);
                await page.screenshot({path:'.visual-check/level1-running-mobile.jpg',type:'jpeg',quality:62,fullPage:false});
                await page.waitForTimeout(3500);
                await page.screenshot({path:'.visual-check/level1-result-mobile.jpg',type:'jpeg',quality:62,fullPage:false});
              }
              await context.close();
            }
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Build visual review snapshots
        run: |
          python3 -m pip install --quiet pillow
          python3 <<'PY'
          from PIL import Image
          import json

          alphabet32 = '0123456789abcdefghijklmnopqrstuv'
          xpm_keys = list('0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz!#$%&()*+,-./:;<=>?@[]^_{|}~')

          def quant(src, size, colors=32):
              img = Image.open(src).convert('RGB').resize(size, Image.Resampling.LANCZOS)
              return img.quantize(colors=colors, method=Image.Quantize.MEDIANCUT)

          def build_json(src, dst):
              q = quant(src,(48,104),32)
              raw = q.getpalette()[:96]
              palette = ['#%02x%02x%02x' % tuple(raw[i:i+3]) for i in range(0,96,3)]
              px = list(q.getdata())
              rows = [''.join(alphabet32[v] for v in px[y*48:(y+1)*48]) for y in range(104)]
              with open(dst,'w') as f:
                  json.dump({'width':48,'height':104,'palette':palette,'rows':rows},f,separators=(',',':'))

          def build_xpm(src, dst, w, h, colors=32):
              q = quant(src,(w,h),colors)
              raw = q.getpalette()[:colors*3]
              palette = [tuple(raw[i:i+3]) for i in range(0,colors*3,3)]
              px = list(q.getdata())
              with open(dst,'w') as f:
                  f.write('/* XPM */\nstatic char * review[] = {\n')
                  f.write(f'"{w} {h} {len(palette)} 1",\n')
                  for i,(r,g,b) in enumerate(palette):
                      f.write(f'"{xpm_keys[i]} c #{r:02x}{g:02x}{b:02x}",\n')
                  for y in range(h):
                      row = ''.join(xpm_keys[v] for v in px[y*w:(y+1)*w])
                      comma = ',' if y < h-1 else ''
                      f.write(f'"{row}"{comma}\n')
                  f.write('};\n')

          build_json('.visual-check/home-mobile.jpg','.visual-check/review-home.json')
          build_json('.visual-check/level1-mobile.jpg','.visual-check/review-level.json')
          build_xpm('.visual-check/home-mobile.jpg','.visual-check/review-home.xpm',32,69)
          build_xpm('.visual-check/level1-mobile.jpg','.visual-check/review-level.xpm',32,69)
          build_xpm('.visual-check/level1-running-mobile.jpg','.visual-check/review-running.xpm',32,69)
          build_xpm('.visual-check/level1-result-mobile.jpg','.visual-check/review-result.xpm',32,69)
          build_xpm('.visual-check/level1-desktop.jpg','.visual-check/review-desktop.xpm',42,61,40)
          build_xpm('.visual-check/board-mobile.jpg','.visual-check/review-board.xpm',48,48,48)
          PY
          printf '%s\n' "$GITHUB_RUN_ID" > .visual-check/run-id.txt

      - name: Publish visual snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .visual-check
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh visual snapshots [skip ci]'
            git push
          fi
