name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '.visual-check/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Install dependencies
        run: npm install

      - name: Build production bundle
        run: npm run build

      - name: Install browser for visual check
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Capture visual snapshots
        run: |
          mkdir -p .visual-check
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/one-move-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then break; fi
            sleep 1
          done
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const cases = [
              {name:'mobile', width:390, height:844},
              {name:'desktop', width:620, height:900},
            ];
            for (const item of cases) {
              const context = await browser.newContext({viewport:{width:item.width,height:item.height},deviceScaleFactor:1,reducedMotion:'reduce'});
              const page = await context.newPage();
              await page.goto('http://127.0.0.1:4173', {waitUntil:'networkidle'});
              await page.screenshot({path:`.visual-check/home-${item.name}.jpg`,type:'jpeg',quality:52,fullPage:false});
              await page.click('#playBtn');
              await page.waitForTimeout(500);
              await page.screenshot({path:`.visual-check/level1-${item.name}.jpg`,type:'jpeg',quality:58,fullPage:false});
              await context.close();
            }
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Build compact visual review map
        run: |
          python3 -m pip install --quiet pillow
          python3 <<'PY'
          from PIL import Image
          import json
          img = Image.open('.visual-check/level1-mobile.jpg').convert('RGB').resize((48,104))
          q = img.quantize(colors=16, method=Image.Quantize.MEDIANCUT)
          pal_raw = q.getpalette()[:48]
          palette = ['#%02x%02x%02x' % tuple(pal_raw[i:i+3]) for i in range(0,48,3)]
          px = list(q.getdata())
          alphabet = '0123456789abcdef'
          rows = [''.join(alphabet[v] for v in px[y*48:(y+1)*48]) for y in range(104)]
          with open('.visual-check/review-map.json','w') as f:
              json.dump({'width':48,'height':104,'palette':palette,'rows':rows},f,separators=(',',':'))
          PY
          printf '%s\n' "$GITHUB_RUN_ID" > .visual-check/run-id.txt

      - name: Publish visual snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .visual-check
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh visual snapshots [skip ci]'
            git push
          fi
